<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" nonce="{{nonce}}" href="{{styleUri}}">
  <title>Juror Panel</title>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div class="eyebrow-row">
        <div class="eyebrow">AI HALLUCINATION JUROR</div>
        <div id="server-status" class="server-status">Checking server</div>
      </div>
      <button id="verify-button" class="verify-button">Verify current file or selection</button>
      <div class="helper">Right-click selected text or use the button above to run the jury.</div>
    </div>
    <div id="content" class="content">
      <div class="idle">
        <div class="idle-title">Ready to verify</div>
        <div class="idle-copy">Open a file, select AI-generated text, and run Juror when you want a quick verdict.</div>
      </div>
    </div>
  </div>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
